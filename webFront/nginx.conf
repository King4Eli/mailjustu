server {
    listen 80;
    server_name _;

    location = / {
        return 302 /webmail/;
    }

    location /webmail/ {
        alias /usr/share/nginx/html/webmail/;
        index index.html;
        try_files $uri $uri/ /webmail/index.html;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
}
