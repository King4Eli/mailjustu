# Optional: spam filtering. Not required for a mail server to send/receive,
# but without it nothing scores or rejects spam.
#
# Layer it onto the base stack with:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.rspamd.yml up -d
#
# Postfix is already configured (see ./.env/postfix.env) to talk to
# mail_justu_rspamd as a milter; it will simply skip that milter (per
# milter_default_action=accept) if this file isn't included.

services:
  # Fast in-memory storage used by Rspamd for caching and spam analysis.
  mail_justu_redis:
    image: redis:8-alpine
    container_name: mail-redis
    restart: unless-stopped
    networks:
      - mail
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Analyzes messages for spam and assigns filtering scores before delivery.
  mail_justu_rspamd:
    image: rspamd/rspamd
    container_name: mail-rspamd
    restart: unless-stopped
    env_file:
      - ./.env/rspamd.env
    depends_on:
      mail_justu_redis:
        condition: service_healthy
    ports:
      - "11334:11334"
    volumes:
      - ./volumes/rspamd:/etc/rspamd
      - rspamd_data:/var/lib/rspamd
    networks:
      - mail

volumes:
  rspamd_data:
