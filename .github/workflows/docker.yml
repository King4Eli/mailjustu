# Tests bigapp, then builds and pushes both of this repo's images to GitHub
# Container Registry (ghcr.io). Other services in compose use upstream images.
#
#   push to main      -> :main, :latest, :sha-<short>
#   push tag v1.2.3   -> :1.2.3, :1.2, :sha-<short>
#   pull request      -> test + build only, nothing pushed
#
# Deploy by setting APP_VERSION in the root .env to one of those tags.
name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bigapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bigapp/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./bigapp
          - name: dkim-sync
            context: ./dkim-sync
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; github.repository_owner may not be.
      - name: Image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/mailjustu-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
