# Provisioned by setup/dovecot-setup.sh into the dovecot_config volume's
# conf.d/auth-sql.conf. This is the readable reference copy -- see
# provision_dovecot_auth() in setup/dovecot-setup.sh for how it's applied,
# and schema.sql for the virtual_users table this authenticates against.
#
# Reuses DB_HOST/DB_USER/DB_PASSWORD/DB_NAME from ./.env/api.env (added as
# a second env_file on mail_justu_dovecot in docker-compose.yml) so there's
# exactly one copy of the DB credentials, not a second one to keep in sync.
import_environment {
  DB_HOST = %{env:DB_HOST}
  DB_USER = %{env:DB_USER}
  DB_PASSWORD = %{env:DB_PASSWORD}
  DB_NAME = %{env:DB_NAME}
}

sql_driver = mysql

# The "mysql" block name must match sql_driver's value -- Dovecot 2.4 looks
# up the connection as a named list filter keyed by driver name, not a
# flat mysql_host/mysql_user/... setting (that syntax parses with
# `doveconf -n` but fails at auth-service startup with "mysql { .. } named
# list filter is missing" -- doveconf -n alone won't catch this, only
# actually starting the auth service will).
mysql mysql {
  host = %{env:DB_HOST}
  dbname = %{env:DB_NAME}
  user = %{env:DB_USER}
  password = %{env:DB_PASSWORD}
}

# virtual_users.password already carries its scheme prefix (e.g.
# {BLF-CRYPT}..., see bigapp/scripts/bootstrap-admin.js and
# bigapp/app/api/admin/mailboxes/route.ts) so no default_password_scheme
# override is needed here.
passdb sql {
  driver = sql
  query = "SELECT password FROM virtual_users WHERE email='%u'"
}

# uid/gid/home all come from the global mail_uid/mail_gid/mail_home in
# dovecot.conf -- this just needs to confirm the user exists.
#
# NOTE: quota isn't wired up here yet -- ./.env/api.env's
# DEFAULT_MAILBOX_QUOTA_MB comment references a quota_rule this query
# doesn't have and a conf.d/quota.conf that doesn't exist. Known gap,
# tracked in .todo.txt, out of scope for the login fix this file is for.
userdb sql {
  driver = sql
  query = "SELECT email AS user FROM virtual_users WHERE email='%u'"
}
