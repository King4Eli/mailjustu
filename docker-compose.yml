name: mail_justu

services:
  # Receives and sends email over SMTP.
  mail_justu_postfix:
    image: boky/postfix
    container_name: mail_justu_postfix
    hostname: ${MAIL_HOSTNAME}
    restart: unless-stopped
    env_file:
      - ./.env/postfix.env
    volumes:
      - postfix_config:/etc/postfix
      - var_mail:/var/mail
      - certs:/etc/ssl/mail
      - postfix_spool:/var/spool/postfix
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    networks:
      - mail_justu_network
      - shared-global-network

  # Serves stored mailboxes over IMAP, including encrypted IMAPS access.
  mail_justu_dovecot:
    image: dovecot/dovecot
    container_name: mail_justu_dovecot
    restart: unless-stopped
    env_file:
      - ./.env/dovecot.env
      # DB_* only, for auth.conf's SQL passdb/userdb (virtual_users lookup)
      - ./.env/api.env
    # Named volumes throughout, no host bind mounts -- see
    # mail_justu_postfix above. vmail_data is the actual mailbox storage
    # (Dovecot's mail_home is /srv/vmail/%{user}, NOT /var/mail).
    volumes:
      - dovecot_config:/etc/dovecot
      - var_mail:/var/mail
      - certs:/etc/ssl/mail
      - vmail_data:/srv/vmail
    ports:
      # This image runs rootless: imap-login actually binds the unprivileged
      # 31143/31993 (see /etc/dovecot/vendor.d/rootless.conf in the
      # dovecot_config volume), not 143/993.
      - "143:31143"
      - "993:31993"
    networks:
      - mail_justu_network
      - shared-global-network

  # Next.js server: webmail + admin dashboard at /webmail, /admin, /api
  mail_justu_server:
    image: kingeli/mail_justu_server:${APP_VERSION:?APP_VERSION must be set}
    container_name: mail_justu_server
    restart: unless-stopped
    environment:
      # read at request time by /api/ping
      - APP_VERSION=${APP_VERSION}
      # used by dns.ts to generate DNS-record suggestions in the admin UI
      - MAIL_HOSTNAME=${MAIL_HOSTNAME}
    env_file:
      - ./.env/api.env
      - ./.env/server.env
      # DOVEADM_PASSWORD only -- loaded straight from dovecot's own env
      # file so there's exactly one copy, not a second one to keep in sync.
      - ./.env/dovecot.env
    depends_on:
      mail_justu_postfix:
        condition: service_started
      mail_justu_dovecot:
        condition: service_started
    expose:
      - "80"
    networks:
      - mail_justu_network
      - shared-global-network

networks:
  mail_justu_network:
    driver: bridge
  shared-global-network:
    external: true

volumes:
  vmail_data:
    name: mail_justu_vmail_data
  postfix_spool:
    name: mail_justu_postfix_spool
  postfix_config:
    name: mail_justu_postfix_config
  dovecot_config:
    name: mail_justu_dovecot_config
  certs:
    name: mail_justu_certs
  var_mail:
    name: mail_justu_var_mail
