name: mail_justu

# Base stack: the minimum required to send and receive mail.
#   docker compose up -d
#
# docker-compose.override.yml is auto-loaded alongside this file and adds
# dev-only ports plus bind-mounted, editable config under ./volumes.
#
# Optional add-ons (spam filtering, DKIM, antivirus) live in their own
# docker-compose.*.yml files -- see README.md for how to layer them in.

services:
  # Receives and sends email over SMTP.
  mail_justu_postfix:
    image: boky/postfix
    container_name: mail-postfix
    hostname: mail.example.com
    restart: unless-stopped
    env_file:
      - ./.env/postfix.env
    # depends_on:
    #   global_mysql:
    #     condition: service_healthy
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    networks:
      - mail_justu_network
      - shared-global-network

  # Serves stored mailboxes over IMAP, including encrypted IMAPS access.
  mail_justu_dovecot:
    image: dovecot/dovecot
    container_name: mail-dovecot
    restart: unless-stopped
    # depends_on:
    #   global_mysql:
    #     condition: service_healthy
    ports:
      # This image runs rootless: imap-login actually binds the unprivileged
      # 31143/31993 (see ./volumes/dovecot/vendor.d/rootless.conf), not 143/993.
      - "143:31143"
      - "993:31993"
    networks:
      - mail_justu_network
      - shared-global-network

  # Backend for admin/ and webUI/: mailbox management, IMAP/SMTP for
  # webmail, and service health/stats. Browsers never talk to the mail
  # stack directly.
  mail_justu_api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: mail_justu_api
    restart: unless-stopped
    env_file:
      - ./.env/api.env
    depends_on:
      # global_mysql:
      #   condition: service_healthy
      mail_justu_postfix:
        condition: service_started
      mail_justu_dovecot:
        condition: service_started
    ports:
      - "4000:4000"
    networks:
      - mail_justu_network
      - shared-global-network

networks:
  mail_justu_network:
    driver: bridge
  shared-global-network:
    external: true
