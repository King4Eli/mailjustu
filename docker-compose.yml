name: mail_justu

services:
  # Receives and sends email over SMTP.
  mail_justu_postfix:
    image: boky/postfix
    container_name: mail_justu_postfix
    hostname: mail.example.com
    restart: unless-stopped
    env_file:
      - ./.env/postfix.env
    volumes:
      - postfix_config:/etc/postfix
      - var_mail:/var/mail
      - certs:/etc/ssl/mail
      - postfix_spool:/var/spool/postfix
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    networks:
      - mail_justu_network
      - shared-global-network

  # Serves stored mailboxes over IMAP, including encrypted IMAPS access.
  mail_justu_dovecot:
    image: dovecot/dovecot
    container_name: mail_justu_dovecot
    restart: unless-stopped
    env_file:
      - ./.env/dovecot.env
    # Named volumes throughout, no host bind mounts -- see
    # mail_justu_postfix above. vmail_data is the actual mailbox storage
    # (Dovecot's mail_home is /srv/vmail/%{user}, NOT /var/mail).
    volumes:
      - dovecot_config:/etc/dovecot
      - var_mail:/var/mail
      - certs:/etc/ssl/mail
      - vmail_data:/srv/vmail
    ports:
      # This image runs rootless: imap-login actually binds the unprivileged
      # 31143/31993 (see /etc/dovecot/vendor.d/rootless.conf in the
      # dovecot_config volume), not 143/993.
      - "143:31143"
      - "993:31993"
    networks:
      - mail_justu_network
      - shared-global-network

  # Backend for admin/ and webUI/:
  mail_justu_api:
    image: king4eli/mail_justu_api:latest
    container_name: mail_justu_api
    restart: unless-stopped
    env_file:
      - ./.env/api.env
    depends_on:
      mail_justu_postfix:
        condition: service_started
      mail_justu_dovecot:
        condition: service_started
    expose:
      - "80"
    networks:
      - mail_justu_network
      - shared-global-network

  # Static webUI
  mail_justu_webui:
    image: king4eli/mail_justu_webui:latest
    container_name: mail_justu_webui
    restart: unless-stopped
    depends_on:
      mail_justu_api:
        condition: service_started
    expose:
      - "80"
    networks:
      - shared-global-network

  # Static admin dashboard
  mail_justu_admin:
    image: king4eli/mail_justu_admin:latest
    container_name: mail_justu_admin
    restart: unless-stopped
    depends_on:
      mail_justu_api:
        condition: service_started
    expose:
      - "80"
    networks:
      - shared-global-network

networks:
  mail_justu_network:
    driver: bridge
  shared-global-network:
    external: true

volumes:
  vmail_data:
    name: mail_justu_vmail_data
  postfix_spool:
    name: mail_justu_postfix_spool
  postfix_config:
    name: mail_justu_postfix_config
  dovecot_config:
    name: mail_justu_dovecot_config
  certs:
    name: mail_justu_certs
  var_mail:
    name: mail_justu_var_mail
