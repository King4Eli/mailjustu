name: mail_justu

services:
  # Receives and sends email over SMTP.
  mail_justu_postfix:
    image: boky/postfix
    container_name: mail-postfix
    hostname: mail.example.com
    restart: unless-stopped
    env_file:
      - ./.env/postfix.env
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    networks:
      - mail_justu_network
      - shared-global-network

  # Serves stored mailboxes over IMAP, including encrypted IMAPS access.
  mail_justu_dovecot:
    image: dovecot/dovecot
    container_name: mail-dovecot
    restart: unless-stopped
    env_file:
      - ./.env/dovecot.env
    ports:
      # This image runs rootless: imap-login actually binds the unprivileged
      # 31143/31993 (see ./volumes/dovecot/vendor.d/rootless.conf), not 143/993.
      - "143:31143"
      - "993:31993"
    networks:
      - mail_justu_network
      - shared-global-network

  # Backend for admin/ and webUI/:
  mail_justu_api:
    image: king4eli/mail_justu_api:latest
    container_name: mail_justu_api
    restart: unless-stopped
    env_file:
      - ./.env/api.env
    depends_on:
      mail_justu_postfix:
        condition: service_started
      mail_justu_dovecot:
        condition: service_started
    expose:
      - "80"
    networks:
      - mail_justu_network
      - shared-global-network

  # Static webUI
  mail_justu_webui:
    image: king4eli/mail_justu_webui:latest
    container_name: mail_justu_webui
    restart: unless-stopped
    depends_on:
      mail_justu_api:
        condition: service_started
    expose:
      - "80"
    networks:
      - shared-global-network

  # Static admin dashboard
  mail_justu_admin:
    image: king4eli/mail_justu_admin:latest
    container_name: mail_justu_admin
    restart: unless-stopped
    depends_on:
      mail_justu_api:
        condition: service_started
    expose:
      - "80"
    networks:
      - shared-global-network

networks:
  mail_justu_network:
    driver: bridge
  shared-global-network:
    external: true
