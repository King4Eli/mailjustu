# Provisioned by setup/dovecot-setup.sh into the dovecot_config volume's
# conf.d/lmtp.conf. This is the readable reference copy.
#
# The image's own dovecot.conf only defines an implicit-TLS `lmtps`
# listener on 31024 (matching the imap/pop3/submission pattern of a
# `<proto>s` listener alongside a plain one -- see vendor.d/rootless.conf)
# -- but it never defines the plain counterpart. Postfix's
# virtual_transport (./.env/postfix.env's POSTFIX_virtual_transport) talks
# plain `lmtp:inet:mail_justu_dovecot:24`, which had nothing listening on
# it, so every delivery deferred forever with "Connection refused" (visible
# only *after* fixing the virtual_mailbox/alias map lookup failure --
# Postfix won't even get to the LMTP handoff if RCPT TO is rejected first).
# This adds that plain listener; `service lmtp { }` blocks merge with the
# one in dovecot.conf rather than replacing it, same as `passdb`/`userdb`.
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
