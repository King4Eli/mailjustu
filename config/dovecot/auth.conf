# Provisioned by setup/dovecot-setup.sh into the dovecot_config volume's
# conf.d/auth.conf. This is the readable reference copy -- see
# provision_dovecot_auth() in setup/dovecot-setup.sh for how it's applied.
#
# Only the doveadm HTTP API's own auth lives here (used by api/'s
# per-mailbox storage lookups, see api/src/doveadm.js). Real IMAP/SMTP
# login auth is in auth-sql.conf / dovecot-auth-sql.conf, not here.
import_environment {
  DOVEADM_PASSWORD = %{env:DOVEADM_PASSWORD | default}
}

doveadm_password = $ENV:DOVEADM_PASSWORD
