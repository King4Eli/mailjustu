# Provisioned into the dovecot_config volume as conf.d/auth.conf by
# setup/dovecot-setup.sh. Real login auth against virtual_users (schema.sql),
# plus the doveadm HTTP API password and a plain LMTP listener for Postfix
# delivery (image only ships an SSL-only lmtps listener).
import_environment {
  DOVEADM_PASSWORD = %{env:DOVEADM_PASSWORD | default}
  DB_HOST = %{env:DB_HOST}
  DB_USER = %{env:DB_USER}
  DB_PASSWORD = %{env:DB_PASSWORD}
  DB_NAME = %{env:DB_NAME}
}

doveadm_password = $ENV:DOVEADM_PASSWORD

sql_driver = mysql
mysql mysql {
  host = %{env:DB_HOST}
  dbname = %{env:DB_NAME}
  user = %{env:DB_USER}
  password = %{env:DB_PASSWORD}
}

# %{user} (not sprintf-style %u, which silently isn't substituted here)
passdb sql {
  driver = sql
  query = "SELECT password FROM virtual_users WHERE email='%{user}'"
}

userdb sql {
  driver = sql
  query = "SELECT email AS user FROM virtual_users WHERE email='%{user}'"
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
